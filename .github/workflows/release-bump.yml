name: Release Bump

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver bump type"
        required: true
        default: minor
        type: choice
        options:
          - minor

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      BASE_VERSION: "2.5.2"
      RELEASE_VERSION: "2.6.0"
      RELEASE_TAG: "v2.6.0"

    steps:
      - name: Reject non-main dispatch
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_REF_NAME}" = "main"
          test "${RELEASE_TYPE}" = "minor"

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean current main and unused tag
        run: |
          git fetch --no-tags origin main
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          test "$(node -p 'require("./package.json").version')" = "${BASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Local release tag already exists: ${RELEASE_TAG}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Remote release tag already exists: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install and verify supported npm CLI
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create exact 2.6.0 metadata and root artifact lock
        id: seed
        run: |
          npm version minor --no-git-tag-version
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_VERSION}"
          SEED_DIR="${RUNNER_TEMP}/cortex-release-seed"
          mkdir -p "${SEED_DIR}"
          npm pack --json --ignore-scripts --pack-destination "${SEED_DIR}" > "${SEED_DIR}/pack.json"
          ROOT_FILENAME="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename' "${SEED_DIR}/pack.json")"
          ROOT_TARBALL="${SEED_DIR}/${ROOT_FILENAME}"
          node scripts/sync-release-version.mjs --root-tarball "${ROOT_TARBALL}"
          node scripts/sync-release-version.mjs --check --root-tarball "${ROOT_TARBALL}"
          echo "root_tarball=${ROOT_TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Verify complete metadata mutation set
        run: |
          ACTUAL="${RUNNER_TEMP}/release-metadata.actual"
          EXPECTED="${RUNNER_TEMP}/release-metadata.expected"
          git diff --name-only | LC_ALL=C sort > "${ACTUAL}"
          printf '%s\n' \
            .claude-plugin/marketplace.json \
            package-lock.json \
            package.json \
            plugins/cortex/.claude-plugin/plugin.json \
            plugins/cortex/.codex-plugin/plugin.json \
            plugins/dsh-cortex/package-lock.json \
            plugins/dsh-cortex/package.json \
            server.json | LC_ALL=C sort > "${EXPECTED}"
          diff -u "${EXPECTED}" "${ACTUAL}"


      - name: Verify diff, secrets, versions, and runtime boundary
        run: |
          npm run release:check-version-sync
          git diff --check
          if git diff | grep -E '(npm_[A-Za-z0-9]{36}|gh[pousr]_[A-Za-z0-9]{20,}|/private/tmp/|/tmp/cortex-release)'; then
            echo "Release diff contains a secret or disposable path"
            exit 1
          fi
          test -z "$(git diff --name-only -- plugins/dsh-cortex/provider.mjs plugins/dsh-cortex/protocol.mjs plugins/dsh-cortex/tools.mjs plugins/dsh-cortex/skills.mjs plugins/dsh-cortex/skills)"

      - name: Stage only the complete release metadata set
        run: |
          git add \
            package.json \
            package-lock.json \
            server.json \
            plugins/cortex/.claude-plugin/plugin.json \
            plugins/cortex/.codex-plugin/plugin.json \
            plugins/dsh-cortex/package.json \
            plugins/dsh-cortex/package-lock.json \
            .claude-plugin/marketplace.json
          test -z "$(git diff --name-only)"
          ACTUAL="${RUNNER_TEMP}/release-staged.actual"
          EXPECTED="${RUNNER_TEMP}/release-staged.expected"
          git diff --cached --name-only | LC_ALL=C sort > "${ACTUAL}"
          printf '%s\n' \
            .claude-plugin/marketplace.json \
            package-lock.json \
            package.json \
            plugins/cortex/.claude-plugin/plugin.json \
            plugins/cortex/.codex-plugin/plugin.json \
            plugins/dsh-cortex/package-lock.json \
            plugins/dsh-cortex/package.json \
            server.json | LC_ALL=C sort > "${EXPECTED}"
          diff -u "${EXPECTED}" "${ACTUAL}"

      - name: Commit and create immutable release tag
        run: |
          git commit -m "release: ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "release: ${RELEASE_TAG}"

      - name: Atomically push release commit and tag
        run: git push --atomic origin "HEAD:main" "refs/tags/${RELEASE_TAG}"

      - name: Trigger publish from the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-publish.yml --ref "${RELEASE_TAG}"
